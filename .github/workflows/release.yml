name: Release Windows

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: "stable"

      - run: flutter config --enable-windows-desktop

      - run: flutter pub get

      # --no-fatal-infos: gagalkan build hanya kalau ada warning/error, bukan sekadar info lint
      - run: flutter analyze --no-fatal-infos

      - run: flutter build windows --release

      # flutter build windows menghasilkan folder (exe + dll + data/) di bawah ini - dizip supaya
      # bisa diunduh sebagai satu file dari halaman Actions/Releases
      - name: Zip build output
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath mahjong-billiard-windows.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahjong-billiard-windows
          path: mahjong-billiard-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mahjong-billiard-windows.zip
          generate_release_notes: true
